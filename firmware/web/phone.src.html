<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Digicam">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f5f3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Digicam</title>
<style>
/* The camera's own photo page, served over its Wi-Fi (design: 09-phone-ui-design.md).
   No internet while connected, so everything is inline: the camera's pixel font (Spleen)
   and Phosphor icons are put in by build.py from phone.src.html. */
@font-face { font-family: Spleen; src: url(data:font/woff;base64,/*FONT*/) format("woff"); font-display: block; }
:root {
  --bg: #f5f3fa; --surface: #ffffff; --ink: #1c1922; --muted: #6c6676; --line: rgba(28, 25, 34, .09);
  --glass: rgba(250, 249, 253, .76); --glass-line: rgba(28, 25, 34, .08); --tile: #e7e3ee;
  --accent: #ff8a3d; --on-accent: #1c1922; --danger: #c62f2f; --on-danger: #ffffff; --scrim: rgba(22, 20, 28, .42);
  --shadow: rgba(28, 25, 34, .16);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --pixel: Spleen, ui-monospace, Menlo, monospace;
  /* z-index scale: header 10, dock 20, viewer 40, sheets 60, toast 80 */
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #16141c; --surface: #221f29; --ink: #f2eff7; --muted: #a39cae; --line: rgba(242, 239, 247, .1);
  --glass: rgba(34, 31, 41, .76); --glass-line: rgba(242, 239, 247, .1); --tile: #2a2632;
  --danger: #e04848; --scrim: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .4); color-scheme: dark; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--ui); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
html.locked, html.locked body { overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ico { width: 22px; height: 22px; flex: none; display: block; }
.ico.s { width: 16px; height: 16px; }
.pixel { font-family: var(--pixel); font-weight: 400; -webkit-font-smoothing: none; letter-spacing: 0; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------------------------------------------------------------- header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 14px 12px; }
.hrow { display: flex; align-items: flex-start; gap: 10px; }
.who { flex: 1; min-width: 0; }
h1.name { margin: 0; font-size: 32px; line-height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.meta span { display: inline-flex; gap: 5px; align-items: center; }
.pill { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--line); font-size: 15px; font-weight: 600;
  display: inline-flex; gap: 6px; align-items: center; justify-content: center; white-space: nowrap; }
.pill:disabled { opacity: .45; }
.selbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
.selbar h2 { margin: 0; font-size: 18px; font-weight: 700; text-align: center; flex: 1; font-variant-numeric: tabular-nums; }
.selbar .pill { min-width: 84px; }

/* ---------------------------------------------------------------- grid */
.sec { display: flex; justify-content: space-between; align-items: baseline; padding-block: 16px 8px; }
.sec h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.sec span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(5, 1fr); } }
.tile { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--tile); display: block; width: 100%;
  transition: transform .18s cubic-bezier(.2, .8, .2, 1); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
/* No "Save to Photos" from the grid: these are small previews, and a save should be the full photo */
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-touch-callout: none;
  opacity: 0; transition: opacity .25s; }
.tile img.in { opacity: 1; }
.tile:active { transform: scale(.97); }
.tile .vid { position: absolute; left: 6px; bottom: 6px; color: #fff; display: flex; gap: 3px; align-items: center;
  font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.tile .done { position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(255, 255, 255, .94); color: #1c1922; display: grid; place-items: center; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.tile .done .ico { width: 13px; height: 13px; }
.tile .frm { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 7px;
  background: rgba(22, 20, 28, .62); color: #fff; display: grid; place-items: center; }
.tile .frm .ico { width: 14px; height: 14px; }
.pop { animation: pop .42s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.tile .pick { position: absolute; right: 6px; bottom: 6px; width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid #fff; background: rgba(0, 0, 0, .2); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); display: grid; place-items: center; color: #1c1922; }
.tile .pick .ico { width: 14px; height: 14px; opacity: 0; }
.tile.on::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--accent); background: rgba(22, 20, 28, .22); }
.tile.on .pick { background: var(--accent); border-color: var(--accent); z-index: 1; }
.tile.on .pick .ico { opacity: 1; }
.selecting .grid { touch-action: pan-y; }
.selecting .tile .done { display: none; }

.skel { background: linear-gradient(100deg, var(--tile) 30%, var(--line) 50%, var(--tile) 70%) 0 0 / 300% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }
.skel-line { height: 14px; border-radius: 7px; width: 60%; margin-top: 10px; }
.skel-name { height: 32px; border-radius: 8px; width: 70%; }
.empty { margin-top: 24px; padding: 28px 22px; border-radius: 22px; background: var(--surface); display: grid; gap: 6px; justify-items: start; }
.empty .ico { width: 32px; height: 32px; color: var(--accent); margin-bottom: 6px; }
.empty b { font-size: 18px; }
.empty span { color: var(--muted); }
.spacer { height: calc(120px + env(safe-area-inset-bottom, 0px)); }

/* ---------------------------------------------------------------- floating toolbar */
.dock { position: fixed; z-index: 20; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; display: flex; gap: 8px; padding: 8px;
  border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 10px 30px var(--shadow);
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
.dock.away { transform: translateY(140%); opacity: 0; pointer-events: none; }
.btn { height: 48px; border-radius: 999px; padding: 0 18px; display: inline-flex; gap: 8px; align-items: center; justify-content: center;
  font-weight: 600; font-size: 16px; white-space: nowrap; color: var(--ink); transition: transform .12s, opacity .2s; font-variant-numeric: tabular-nums; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); flex: 1; min-width: 0; }
.btn.quiet { background: var(--line); }
.btn.round { width: 48px; padding: 0; flex: none; }
.btn.danger { background: var(--danger); color: var(--on-danger); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.narrow { padding: 0 14px; }

/* ---------------------------------------------------------------- viewer (always dark) */
.viewer { position: fixed; inset: 0; z-index: 40; color: #f2eff7; }
.viewer .bgv { position: absolute; inset: 0; background: #0d0c10; transition: opacity .3s; }
.viewer .top { position: absolute; z-index: 2; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); transition: opacity .25s; }
.chip { height: 40px; min-width: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 14px; background: rgba(255, 255, 255, .13); color: #f2eff7; font-size: 14px; font-variant-numeric: tabular-nums;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.chip.ic { padding: 0; width: 40px; }
.chip.pixel { font-size: 16px; }
.strip { position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  scrollbar-width: none; touch-action: pan-x; overscroll-behavior: contain; }
.strip::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; display: grid; place-items: center; position: relative;
  padding: calc(env(safe-area-inset-top, 0px) + 64px) 0 calc(env(safe-area-inset-bottom, 0px) + 150px); }
.slide .ph { position: relative; max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; width: 100%; }
.slide .ph img, .slide .ph canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
/* the thumbnail shows at once; the full photo fades in over it, and only the full one can be saved */
.slide .ph img.small { -webkit-touch-callout: none; pointer-events: none; filter: blur(2px); transform: scale(1.01); }
.slide .ph img.full { opacity: 0; transition: opacity .25s; -webkit-touch-callout: default; }
.slide .ph img.full.in { opacity: 1; }
.slide .ph canvas { background: #000; }
.slide .playbtn { position: absolute; z-index: 1; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; background: rgba(0, 0, 0, .38); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.slide .playbtn .ico { width: 32px; height: 32px; margin-left: 4px; }
.loadbar { position: absolute; left: 0; right: 0; bottom: -10px; height: 3px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .14); }
.loadbar i { position: absolute; inset: 0; width: 30%; background: rgba(255, 255, 255, .7); animation: slidebar 1s ease-in-out infinite; }
@keyframes slidebar { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.viewer .hint { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); text-align: center;
  font-size: 14px; color: #d8d2e2; display: flex; gap: 8px; align-items: center; justify-content: center; transition: opacity .25s; }
.viewer .hint i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #d8d2e2; position: relative; flex: none; }
.viewer .hint i::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: #d8d2e2; animation: hold 1.6s ease-in-out infinite; }
.viewer .hint.flash { color: #fff; }
@keyframes hold { 0%, 100% { transform: scale(.4); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }
.viewer .dock { background: rgba(34, 31, 41, .72); border-color: rgba(255, 255, 255, .08); box-shadow: none; }
.viewer .dock .btn { color: #f2eff7; }
.viewer .dock .btn.primary { color: #1c1922; }
.viewer .dock .btn.quiet { background: rgba(255, 255, 255, .12); }
.viewer .dock .btn.quiet.on { background: rgba(255, 138, 61, .22); color: #ffb98a; }
.ghost { position: fixed; z-index: 45; object-fit: cover; pointer-events: none; transform-origin: 0 0;
  transition: transform .34s cubic-bezier(.2, .8, .2, 1), clip-path .34s cubic-bezier(.2, .8, .2, 1); }

/* ---------------------------------------------------------------- not connected */
.away { padding-block: 40px; max-width: 520px; }
.away .mark { width: 76px; height: 76px; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px var(--shadow); }
.away .mark img { width: 100%; height: 100%; display: block; }
.away h1 { font-size: 32px; line-height: 36px; margin: 28px 0 8px; }
.away .lead { margin: 0 0 28px; color: var(--muted); max-width: 32ch; }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 16px; border-radius: 22px; background: var(--surface); }
.step .n { width: 32px; height: 32px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 16px; }
.step b { display: block; margin-bottom: 2px; }
.step span { color: var(--muted); font-size: 14px; }
.ssid { display: inline-flex; margin-top: 10px; padding: 6px 12px; border-radius: 999px; background: var(--line); color: var(--ink); font-size: 16px; }
.looking { margin-top: 28px; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 15px; }
.looking .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255, 138, 61, .45); } 100% { box-shadow: 0 0 0 12px rgba(255, 138, 61, 0); } }

/* ---------------------------------------------------------------- sheets and toast */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; transition: opacity .28s; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; z-index: 61; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-radius: 32px; background: var(--surface); color: var(--ink); padding: 14px 22px 22px; box-shadow: 0 20px 60px var(--shadow);
  transform: translateY(110%); transition: transform .38s cubic-bezier(.2, .9, .25, 1); }
.sheet.show { transform: none; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
.sheet h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.01em; text-wrap: balance; }
.sheet p { margin: 0 0 16px; color: var(--muted); }
.sheet .row { display: flex; gap: 8px; margin-top: 4px; }
.sheet .row .btn { flex: 1; }
.appline { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
.appline img { width: 60px; height: 60px; border-radius: 14px; flex: none; display: block; }
.appline h2 { margin: 0; }
.appline p { margin: 2px 0 0; }
.how { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 12px; }
.how li { display: flex; gap: 12px; align-items: center; }
.how .k { width: 36px; height: 36px; border-radius: 10px; background: var(--line); display: grid; place-items: center; flex: none; color: var(--accent); font-size: 15px; font-weight: 700; }
.how code { font: 600 15px ui-monospace, Menlo, monospace; background: var(--line); padding: 1px 6px; border-radius: 6px; }
.opt { margin: 14px 0 0; }
.opt > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--line); font-size: 15px; font-weight: 600; color: var(--ink); }
.seg button.on { background: var(--ink); color: var(--bg); }
.link { color: var(--accent); font-weight: 650; }
.sheet .wide { width: 100%; margin-top: 18px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }

.toast { position: fixed; z-index: 80; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translate(-50%, -160%);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 20px; font-size: 15px; font-weight: 600;
  width: max-content; max-width: calc(100% - 32px); text-align: center;
  display: flex; gap: 8px; align-items: center; transition: transform .35s cubic-bezier(.2, .9, .25, 1); box-shadow: 0 8px 24px var(--shadow); }
.toast.show { transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><!--SPRITE--></svg>

<div id="app"></div>
<div class="dock away" id="dock"></div>
<div id="viewerHost"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const SHORTCUT = "Save from Digicam";
const base = location.origin + location.pathname.replace(/[^/]*$/, "");
const $ = s => document.querySelector(s);
const icon = (id, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const html = document.documentElement;

let items = [], camera = "", owner = "", battery = null;
let mode = "loading";                 // loading | library | away
let selecting = false, picked = new Set(), saved = new Set();

// ---------------------------------------------------------------- remembered on this phone
const store = {
  get(k, d) { try { const v = localStorage.getItem((camera || "cam") + ":" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem((camera || "cam") + ":" + k, JSON.stringify(v)); } catch (e) {} },
  any(k, d) { try { const v = localStorage.getItem("any:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  setAny(k, v) { try { localStorage.setItem("any:" + k, JSON.stringify(v)); } catch (e) {} },
};

const isVideo = it => it.v === 1;
const fmtSize = n => n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB";
const fresh = () => items.filter(i => !isVideo(i) && !saved.has(i.n));
const num = n => parseInt(n.slice(4, 8), 10) || 0;
const thumbUrl = n => base + "thumb/" + n;
const fileUrl = n => base + "file/" + n;

function markSaved(names) {
  let changed = false;
  names.forEach(n => { if (!saved.has(n)) { saved.add(n); changed = true; } });
  if (changed) store.set("saved", [...saved]);
  return changed;
}

// ---------------------------------------------------------------- loading
async function load(quiet) {
  if (!quiet) { mode = "loading"; render(); }
  try {
    const [r, fr] = await Promise.all([
      fetch(base + "api/list", { cache: "no-store" }),
      fetch(base + "api/frame", { cache: "no-store" }).catch(() => null),
    ]);
    if (!r.ok) throw new Error("list");
    const d = await r.json();
    items = d.items || [];
    camera = d.camera || "digicam";
    owner = d.owner || "";
    battery = d.battery;
    store.setAny("owner", owner);
    store.setAny("camera", camera);
    saved = new Set(store.get("saved", []));
    await readFrame(fr);
    mode = "library";
    render();
    if (!standalone && !store.any("homeSeen", false)) setTimeout(homeScreenSheet, 900);
  } catch (e) {
    mode = "away";
    render();
  }
}

// ---------------------------------------------------------------- thumbnails, a few at a time
// The camera serves one request at a time. Asking for every thumbnail at once made a tapped
// photo wait behind all of them, so the grid asks for three at a time, nearest first, and
// stops while a photo is open.
const thumbQ = [];
let thumbBusy = 0, thumbPaused = false;
const THUMB_AT_ONCE = 3;
const thumbObs = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  thumbObs.unobserve(e.target);
  thumbQ.push(e.target);
  pumpThumbs();
}), { rootMargin: "400px 0px" }) : null;
function queueThumb(img) { if (thumbObs) thumbObs.observe(img); else { thumbQ.push(img); pumpThumbs(); } }
function pumpThumbs() {
  while (!thumbPaused && thumbBusy < THUMB_AT_ONCE && thumbQ.length) {
    const img = thumbQ.shift();
    if (!img.isConnected) continue;
    thumbBusy++;
    const done = () => { thumbBusy--; img.classList.add("in"); pumpThumbs(); };
    img.onload = done; img.onerror = done;
    img.src = img.dataset.src;
  }
}

// ---------------------------------------------------------------- library
function tileHTML(it) {
  const on = picked.has(it.n);
  return `<button class="tile${on ? " on" : ""}" data-n="${esc(it.n)}" aria-label="${isVideo(it) ? "Video" : "Photo"} ${esc(it.n)}${saved.has(it.n) ? ", saved" : ""}${onFrame(it.n) ? ", on the frame" : ""}">
    <img data-src="${thumbUrl(it.n)}" alt="" decoding="async" draggable="false">
    ${isVideo(it) ? `<span class="vid">${icon("play-fill", "ico s")}video</span>` : ""}
    ${saved.has(it.n) && !isVideo(it) ? `<span class="done">${icon("check")}</span>` : ""}
    ${onFrame(it.n) ? `<span class="frm">${icon("image-fill")}</span>` : ""}
    ${selecting ? `<span class="pick">${icon("check")}</span>` : ""}</button>`;
}
function title() { return owner ? `${owner}'s camera` : (camera || "digicam"); }

function render() {
  const app = $("#app");
  document.body.classList.toggle("selecting", selecting);

  const head = selecting

         <h2 id="selCount">${picked.size ? picked.size + " selected" : "Select items"}</h2>

    : `<div class="hrow"><div class="who"><h1 class="name pixel">${esc(title())}</h1>
         <div class="meta"><span>${photos} ${photos === 1 ? "photo" : "photos"}</span>${videos ? `<span>${videos} ${videos === 1 ? "video" : "videos"}</span>` : ""}${battery != null ? `<span>${icon("battery-high", "ico s")}${battery}%</span>` : ""}</div></div>
         ${frameReady ? `<button class="pill" id="frameBtn">${icon("image", "ico s")}Frame</button>` : ""}</div>`;
  const newOnes = items.filter(i => !saved.has(i.n) || isVideo(i)), old = items.filter(i => saved.has(i.n) && !isVideo(i));
  let body = "";
  if (!items.length) {
    body = `<div class="gut"><div class="empty">${icon("camera")}<b>No photos yet</b><span>Press the shutter on the camera, then come back here.</span></div></div>`;
  } else {
    if (newOnes.length) body += `<div class="gut sec"><h3>New</h3><span>${fresh().length ? fresh().length + " not saved" : "videos stay on the camera"}</span></div>
      <div class="grid">${newOnes.map(tileHTML).join("")}</div>`;
    if (old.length) body += `<div class="gut sec"><h3>Saved</h3><span>${old.length}</span></div><div class="grid">${old.map(tileHTML).join("")}</div>`;
  }
  thumbQ.length = 0;
  if (thumbObs) thumbObs.disconnect();
  app.innerHTML = `<header class="gut">${head}</header>${body}<div class="spacer"></div>`;
  app.querySelectorAll(".tile img").forEach(queueThumb);
  wireLibrary();
  dockForLibrary();
}

function dock(markup) {

  d.classList.remove("away");
}
function dockForLibrary() {

    dock(`<button class="btn round quiet" id="delSel" aria-label="Delete selected"${picked.size ? "" : " disabled"}>${icon("trash")}</button>
          ${frameReady ? `<button class="btn quiet narrow" id="sendFrame"${photos ? "" : " disabled"}>${icon("image", "ico s")}Send to frame</button>` : ""}
          <button class="btn primary narrow" id="saveSel"${photos ? "" : " disabled"}>${icon("download-simple")}${photos ? `Save ${photos}` : "Save"}</button>`);

  } else {

    $("#selBtn").onclick = () => { selecting = true; picked.clear(); render(); };

}
function wireLibrary() {
  const fb = $("#frameBtn");
  if (fb) fb.onclick = frameSheet;
  const c = $("#cancelSel");
  if (c) c.onclick = () => { selecting = false; picked.clear(); render(); };
  const a = $("#allNew");
  if (a) a.onclick = () => { fresh().forEach(i => picked.add(i.n)); render(); };
  document.querySelectorAll(".grid").forEach(g => {
    g.addEventListener("click", e => {
      const t = e.target.closest(".tile");
      if (!t || dragged) return;
      if (selecting) togglePick(t); else openViewer(items.findIndex(i => i.n === t.dataset.n), t);
    });
    // drag sideways across tiles to pick a run of them
    g.addEventListener("pointerdown", e => {
      if (!selecting) return;
      const t = e.target.closest(".tile");

      drag = { x: e.clientX, on: !picked.has(t.dataset.n), started: false, seen: new Set() };

}

addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.started) {

  const t = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".tile");

addEventListener("pointercancel", () => { drag = null; dragged = false; });

// ---------------------------------------------------------------- saving many: the free Shortcut
// A web page can't put photos into the Photos app by itself. One photo at a time works by
// pressing and holding it in the viewer. To save many in one go, the page hands their
// addresses to a Shortcut the person adds once ("Save from Digicam").
let pendingSave = null, awaitingReturn = false;
function saveMany(names) {
  if (!names.length) return;

  runShortcut(names);
}
function runShortcut(names) {

    <p>To save one photo, open it, then press and hold it and tap <b>Save to Photos</b>. That needs no setup.</p>

      <li><span class="k">2</span><span>Add <b>Split Text</b>: Shortcut Input, by New Lines</span></li>
      <li><span class="k">3</span><span>Add <b>Repeat with Each</b>, and inside it <b>Get Contents of URL</b> (Repeat Item)</span></li>

// ---------------------------------------------------------------- deleting
function confirmDelete(names, fromViewer) {
  const one = names.length === 1, vid = one && names[0].endsWith(".AVI");
  sheet(`<div class="grab"></div><h2>${one ? `Delete this ${vid ? "video" : "photo"}?` : `Delete ${names.length} items?`}</h2>
    <p>${one ? "It's" : "They're"} removed from the camera's card. Copies already in your Photos stay.</p>
    <div class="row"><button class="btn quiet" id="dNo">Keep</button><button class="btn danger" id="dYes">Delete</button></div>`);
  $("#dNo").onclick = closeSheet;
  $("#dYes").onclick = async () => {
    closeSheet();
    const gone = [];
    for (const n of names) {                 // one at a time: the camera serves one request at once
      try {
        const r = await fetch(base + "api/delete", { method: "POST", body: n });
        if ((await r.json()).ok) gone.push(n);
      } catch (e) { /* counted below */ }
    }
    items = items.filter(i => !gone.includes(i.n));
    if (gone.some(onFrame)) removeFromFrame(gone);
    selecting = false; picked.clear();
    toast(gone.length === names.length ? `${icon("trash")}Deleted from the camera` : `Couldn't delete ${names.length - gone.length} of them`);
    if (fromViewer) {
      if (!items.length) return closeViewer(true);
      buildViewer(Math.min(viewer.index, items.length - 1));
    }
    render();
  };
}

// ---------------------------------------------------------------- viewer
let viewer = null;
function openViewer(index, fromTile) {
  html.classList.add("locked");
  $("#dock").classList.add("away");
  thumbPaused = true;                          // the full photo goes first
  $("#viewerHost").innerHTML = `<div class="viewer" id="viewer">
    <div class="bgv" id="vbg"></div>
    <div class="top" id="vtop"><button class="chip ic" id="vClose" aria-label="Close">${icon("x")}</button>
      <span class="chip pixel" id="vPos"></span><span class="chip" id="vSize"></span></div>
    <div class="strip" id="strip"></div>
    <div class="hint" id="vHint"><i></i><span id="vHintText">Press and hold the photo to save it</span></div>
    <div class="dock" id="vDock"></div></div>`;
  viewer = { index, full: new Map() };
  buildViewer(index);
  $("#vClose").onclick = () => closeViewer();
  wireSwipeDown();
  if (fromTile && !reduce) flyIn(fromTile, index);
}
function buildViewer(index) {
  const strip = $("#strip");
  strip.innerHTML = items.map((it, i) => `<div class="slide" data-i="${i}"><div class="ph">
    <img class="small" alt="" draggable="false"${Math.abs(i - index) <= 2 ? ` src="${thumbUrl(it.n)}"` : ""}>
    ${isVideo(it) ? `<button class="playbtn" aria-label="Play video">${icon("play-fill")}</button>` : `<img class="full" alt="${esc(it.n)}">`}
    </div></div>`).join("");
  strip.scrollLeft = index * strip.clientWidth;
  viewer.index = index;
  showSlide(index);
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting && e.intersectionRatio > .6) showSlide(+e.target.dataset.i);
  }), { root: strip, threshold: [.6] });
  strip.querySelectorAll(".slide").forEach(s => io.observe(s));
  strip.querySelectorAll(".playbtn").forEach(b => b.onclick = () => playVideo(b));
  strip.querySelectorAll("img.full").forEach(wireHoldToSave);
}
function slideEl(i) { return document.querySelector(`#strip .slide[data-i="${i}"]`); }
function showSlide(i) {
  if (!viewer) return;
  viewer.index = i;
  stopVideo();
  // thumbnails for the neighbours, so a swipe always lands on something
  for (let k = i - 2; k <= i + 2; k++) {
    const s = slideEl(k), sm = s && s.querySelector("img.small");
    if (sm && !sm.getAttribute("src")) sm.src = thumbUrl(items[k].n);
  }
  loadFull(i).then(() => { loadFull(i + 1); loadFull(i - 1); });   // this one first, then either side
  updateViewer();
}
// The full photo, at most one download at a time; the browser keeps it, as the camera marks
// photos as never changing.
function loadFull(i) {
  const it = items[i], s = slideEl(i);
  if (!it || !s || isVideo(it)) return Promise.resolve();
  if (viewer.full.has(i)) return viewer.full.get(i);
  const img = s.querySelector("img.full");
  const p = new Promise(res => {
    const bar = document.createElement("div");
    bar.className = "loadbar"; bar.innerHTML = "<i></i>";
    s.querySelector(".ph").appendChild(bar);
    img.onload = () => { img.classList.add("in"); bar.remove(); s.querySelector("img.small")?.remove(); res(); if (viewer && viewer.index === i) updateViewer(); };
    let tries = 0;
    img.onerror = () => {                      // a download cut short: try once more
      if (++tries < 2 && viewer) { img.src = fileUrl(it.n) + "?retry=" + tries; return; }
      bar.remove(); if (viewer) viewer.full.delete(i); res();
    };
    img.src = fileUrl(it.n);
  });
  viewer.full.set(i, p);
  return p;
}
function wireHoldToSave(img) {
  // iOS doesn't say whether "Save to Photos" was chosen; holding the full photo is taken as a save
  let t = null;
  img.addEventListener("touchstart", () => {
    if (!img.classList.contains("in")) return;
    t = setTimeout(() => {
      const it = items[viewer.index];
      if (it && markSaved([it.n])) updateViewer();
    }, 600);
  }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(ev => img.addEventListener(ev, () => clearTimeout(t), { passive: true }));
}
function updateViewer() {
  const it = items[viewer.index];
  if (!it) return;
  $("#vPos").textContent = String(viewer.index + 1).padStart(2, "0") + "/" + String(items.length).padStart(2, "0");
  const loaded = !isVideo(it) && slideEl(viewer.index)?.querySelector("img.full.in");
  $("#vSize").textContent = isVideo(it) ? fmtSize(it.s) : loaded ? fmtSize(it.s) : "Loading";
  const hint = $("#vHint");
  hint.hidden = isVideo(it);
  $("#vHintText").textContent = saved.has(it.n) ? "Saved. Hold again to save another copy" : loaded ? "Press and hold the photo to save it" : "Loading the full photo";
  const d = $("#vDock");
  const frameBtn = frameReady && !isVideo(it)
    ? `<button class="btn quiet narrow${onFrame(it.n) ? " on" : ""}" id="vFrame">${icon("image", "ico s")}${onFrame(it.n) ? "On frame ✓" : "Add to frame"}</button>` : "";
  d.innerHTML = `<button class="btn round quiet" id="vDel" aria-label="Delete">${icon("trash")}</button>${frameBtn}` + (isVideo(it)
    ? `<button class="btn primary" disabled>Videos stay on the camera</button>`
    : `<button class="btn primary narrow" id="vSave">${icon(saved.has(it.n) ? "check" : "download-simple")}${saved.has(it.n) ? "Saved" : "Save"}</button>`);
  $("#vDel").onclick = () => confirmDelete([it.n], true);
  const f = $("#vFrame");
  if (f) f.onclick = () => { if (onFrame(it.n)) removeFromFrame([it.n]); else addToFrame([it.n]); updateViewer(); };
  const s = $("#vSave");
  if (s) s.onclick = () => {
    if (store.any("shortcut", false)) return runShortcut([it.n]);
    hint.classList.add("flash");
    $("#vHintText").textContent = "Press and hold the photo, then tap Save to Photos";
    setTimeout(() => hint.classList.remove("flash"), 1600);
  };
}
function photoRect() {
  const slide = $("#strip .slide"), cs = getComputedStyle(slide);
  const top = parseFloat(cs.paddingTop), bottom = parseFloat(cs.paddingBottom);
  const W = innerWidth, H = innerHeight - top - bottom;
  const w = Math.min(W, H * 4 / 3), h = w * 3 / 4;

}

  return g;
}
function flyIn(tile, index) {
  const from = tile.getBoundingClientRect(), to = photoRect();
  const g = ghostFrom(thumbUrl(items[index].n), to);
  const crop = (to.width - to.height) / 2, s = from.width / to.height;
  g.style.clipPath = `inset(0 ${crop}px 0 ${crop}px)`;
  g.style.transform = `translate(${from.left - (to.left + crop * s)}px, ${from.top - to.top}px) scale(${s})`;
  g.style.transition = "none";
  document.body.appendChild(g);
  const strip = $("#strip"), bg = $("#vbg"), top = $("#vtop");
  strip.style.opacity = 0; bg.style.opacity = 0; top.style.opacity = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    g.style.transition = "";
    g.style.transform = "none"; g.style.clipPath = "inset(0 0 0 0)";
    bg.style.opacity = 1; top.style.opacity = 1;
    setTimeout(() => { strip.style.opacity = 1; g.remove(); }, 360);
  }));
}
function closeViewer(skipAnim) {
  if (!viewer) return;

  const it = items[viewer.index];
  const done = () => {
    $("#viewerHost").innerHTML = ""; viewer = null;
    html.classList.remove("locked");
    thumbPaused = false;
    render();
  };
  const tile = it && document.querySelector(`.tile[data-n="${it.n}"]`);
  if (skipAnim || reduce || !tile) return done();
  const r = tile.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return done();
  const to = photoRect(), crop = (to.width - to.height) / 2, s = r.width / to.height;
  const g = ghostFrom(thumbUrl(it.n), to);
  document.body.appendChild(g);
  ["#strip", "#vtop", "#vbg", "#vDock", "#vHint"].forEach(q => { const e = $(q); if (e) e.style.opacity = 0; });
  requestAnimationFrame(() => {
    g.style.clipPath = `inset(0 ${crop}px 0 ${crop}px)`;
    g.style.transform = `translate(${r.left - (to.left + crop * s)}px, ${r.top - to.top}px) scale(${s})`;

function wireSwipeDown() {
  const strip = $("#strip"), bg = $("#vbg");
  let y0 = null, x0 = 0, ph = null, dy = 0;
  strip.addEventListener("touchstart", e => {
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0;
    ph = slideEl(viewer.index)?.querySelector(".ph");
  }, { passive: true });
  strip.addEventListener("touchmove", e => {
    if (y0 === null || !ph) return;
    const ddy = e.touches[0].clientY - y0, ddx = e.touches[0].clientX - x0;
    if (dy === 0 && Math.abs(ddx) > Math.abs(ddy)) { y0 = null; return; }   // sideways: the strip's
    dy = Math.max(0, ddy);
    ph.style.transition = "none";
    ph.style.transform = `translateY(${dy}px) scale(${1 - Math.min(dy, 300) / 1500})`;
    bg.style.opacity = 1 - Math.min(dy, 300) / 400;
  }, { passive: true });
  strip.addEventListener("touchend", () => {
    if (y0 === null || !ph) return;

    ph.style.transform = ""; bg.style.opacity = 1;
  });
}

// ---------------------------------------------------------------- videos
// The camera records MJPEG in an AVI, which iPhones can't play: each '00dc' chunk is one
// JPEG frame, drawn here on a canvas.
let player = null;
async function playVideo(btn) {
  const slide = btn.closest(".slide"), it = items[+slide.dataset.i];
  stopVideo();
  btn.hidden = true;
  const ph = slide.querySelector(".ph");
  const bar = document.createElement("div");
  bar.className = "loadbar"; bar.innerHTML = "<i></i>";
  ph.appendChild(bar);
  const token = {};
  player = token;
  try {
    const buf = await (await fetch(fileUrl(it.n))).arrayBuffer();
    if (player !== token) return;
    const b = new Uint8Array(buf), dv = new DataView(buf);
    const usPerFrame = dv.getUint32(32, true) || 66666;
    const frames = [];
    for (let p = 224; p + 8 <= b.length;) {
      if (b[p] !== 0x30 || b[p + 1] !== 0x30 || b[p + 2] !== 0x64 || b[p + 3] !== 0x63) break;
      const len = dv.getUint32(p + 4, true);
      frames.push(b.subarray(p + 8, p + 8 + len));
      p += 8 + len + (len & 1);
    }
    bar.remove();
    const canvas = document.createElement("canvas");
    ph.appendChild(canvas);
    token.canvas = canvas;
    const ctx = canvas.getContext("2d");
    let i = 0;
    const step = async () => {
      if (player !== token || !frames.length) return;
      const bmp = await createImageBitmap(new Blob([frames[i]], { type: "image/jpeg" }));
      if (canvas.width !== bmp.width) { canvas.width = bmp.width; canvas.height = bmp.height; }
      ctx.drawImage(bmp, 0, 0);
      i = (i + 1) % frames.length;
      token.timer = setTimeout(step, usPerFrame / 1000);
    };
    step();
    token.btn = btn;
  } catch (e) {
    bar.remove(); btn.hidden = false;
    toast("Couldn't load the video");
  }
}
function stopVideo() {
  if (!player) return;
  clearTimeout(player.timer);
  player.canvas?.remove();
  if (player.btn) player.btn.hidden = false;
  player = null;
}

  interval: ["Change every", [[5, "5 s"], [10, "10 s"], [30, "30 s"], [60, "1 min"], [300, "5 min"]]],
  transition: ["Transition", [["cut", "Cut"], ["fade", "Fade"], ["slide", "Slide"]]],
  look: ["Look", [["natural", "Natural"], ["contrast", "Contrast"], ["vivid", "Vivid"], ["warm", "Warm"]]],
  order: ["Order", [["newest", "Newest first"], ["oldest", "Oldest first"], ["shuffle", "Shuffle"]]],
  brightness: ["Brightness", [[30, "Low"], [60, "Medium"], [100, "High"]]],
};
let frame = { ...FRAME_DEFAULTS, items: [] };
let frameReady = false;   // only save once the camera's copy has been read, so nothing is overwritten
const onFrame = n => frame.items.some(i => i.n === n);

async function readFrame(fr) {
  if (!fr || (fr.status !== 200 && fr.status !== 204)) { frameReady = false; return; }   // 404: older firmware
  let doc = {};
  if (fr.status === 200) { try { doc = await fr.json(); } catch (e) { doc = {}; } }
  const list = Array.isArray(doc.items) ? doc.items.filter(i => i && typeof i.n === "string" && /^DSC_\d{4}\.JPG$/.test(i.n)) : [];
  frame = { ...FRAME_DEFAULTS };
  for (const k of Object.keys(FRAME_DEFAULTS)) if (doc[k] !== undefined) frame[k] = doc[k];
  frame.v = 1;
  frame.rev = Number.isInteger(doc.rev) ? doc.rev : 0;
  frame.items = list.map(i => ({ n: i.n, s: i.s | 0 }));
  frameReady = true;
}
function frameDoc(rev) {
  return JSON.stringify({
    v: 1, rev, interval: frame.interval, transition: frame.transition, look: frame.look,
    order: frame.order, brightness: frame.brightness, items: frame.items.map(i => ({ n: i.n, s: i.s })),
  });
}
// One save at a time; a change made while one is on its way is sent straight after it
let frameSaving = false, frameAgain = false;
async function saveFrame() {
  if (!frameReady) return;
  if (frameSaving) { frameAgain = true; return; }
  frameSaving = true;
  const rev = frame.rev + 1;
  try {
    const r = await fetch(base + "api/frame", { method: "POST", headers: { "Content-Type": "application/json" }, body: frameDoc(rev) });
    if (!r.ok || !(await r.json()).ok) throw new Error();
    frame.rev = rev;
    if (!frameAgain) toast("Saved. The frame picks it up within a minute while Phone mode is on.");
  } catch (e) {
    toast("Couldn't save to the camera");
  }
  frameSaving = false;
  if (frameAgain) { frameAgain = false; saveFrame(); }
}
function addToFrame(names) {
  const add = names.filter(n => !n.endsWith(".AVI") && !onFrame(n));
  if (!add.length) return true;
  if (frame.items.length + add.length > FRAME_MAX) {
    toast(`The frame holds up to ${FRAME_MAX} photos. Take some off first.`);
    return false;
  }
  add.forEach(n => { const it = items.find(i => i.n === n); frame.items.push({ n, s: it ? it.s : 0 }); });
  frame.items.sort((a, b) => num(b.n) - num(a.n));   // newest first
  saveFrame();
  return true;
}
function removeFromFrame(names) {
  const before = frame.items.length;
  frame.items = frame.items.filter(i => !names.includes(i.n));
  if (frame.items.length !== before) saveFrame();
}
function frameSheet() {
  const onCard = new Set(items.map(i => i.n));
  const here = frame.items.filter(i => onCard.has(i.n)).length, gone = frame.items.length - here;
  sheet(`<div class="grab"></div><h2>Photo frame</h2>
    <p>${here === 1 ? "1 photo" : here + " photos"} on the frame (up to ${FRAME_MAX}).${here ? "" : " Add some from a photo, or pick several in Select."}</p>
    ${gone ? `<p>${gone} more only on the frame, deleted from the camera. <button class="link" id="fGone">Take them off</button></p>` : ""}
    ${Object.entries(FRAME_OPTIONS).map(([key, [label, opts]]) => `<div class="opt"><span>${label}</span><div class="seg">${
      opts.map(([v, l]) => `<button data-key="${key}" data-v="${v}" class="${frame[key] === v ? "on" : ""}">${l}</button>`).join("")}</div></div>`).join("")}
    <button class="btn quiet wide" id="fClear" style="color:var(--danger)"${frame.items.length ? "" : " disabled"}>Take all photos off the frame</button>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="fDone">Done</button></div>`);
  document.querySelectorAll("#sheet .seg button").forEach(b => b.onclick = () => {
    const key = b.dataset.key, v = typeof FRAME_DEFAULTS[key] === "number" ? Number(b.dataset.v) : b.dataset.v;
    if (frame[key] === v) return;
    frame[key] = v;
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    saveFrame();
  });
  const g = $("#fGone");
  if (g) g.onclick = () => { removeFromFrame(frame.items.filter(i => !onCard.has(i.n)).map(i => i.n)); frameSheet(); };
  $("#fDone").onclick = () => { closeSheet(); render(); };
  $("#fClear").onclick = () => {
    sheet(`<div class="grab"></div><h2>Take all photos off the frame?</h2>
      <p>They stay on the camera. The frame clears them at its next check.</p>
      <div class="row"><button class="btn quiet" id="cNo">Keep</button><button class="btn danger" id="cYes">Take off</button></div>`);
    $("#cNo").onclick = frameSheet;
    $("#cYes").onclick = () => { frame.items = []; saveFrame(); closeSheet(); render(); };
  };
}

// ---------------------------------------------------------------- Home Screen (once, in Safari)
function homeScreenSheet() {
  if (document.querySelector("#sheet.show")) return;
  store.setAny("homeSeen", true);
  sheet(`<div class="grab"></div>
    <div class="appline"><img src="icon-180.png" alt=""><div><h2>Keep Digicam on your Home Screen</h2><p>Opens full screen, like an app. Free, and only once.</p></div></div>
    <ul class="how">
      <li><span class="k">${icon("export")}</span>Tap Share in Safari's toolbar</li>
      <li><span class="k">${icon("plus-square")}</span>Choose Add to Home Screen</li>
      <li><span class="k">${icon("camera")}</span>Open Digicam from there next time</li>
    </ul>
    <div class="row"><button class="btn primary" id="hsOk">Got it</button></div>`);
  $("#hsOk").onclick = closeSheet;
}

// ---------------------------------------------------------------- sheets and toast
let sheetOpen = false;
function sheet(markup) {
  const s = $("#sheet"), sc = $("#scrim");
  s.innerHTML = markup; s.hidden = false; sc.hidden = false; sheetOpen = true;
  requestAnimationFrame(() => { s.classList.add("show"); sc.classList.add("show"); });
}
function closeSheet() {
  const s = $("#sheet"), sc = $("#scrim");
  sheetOpen = false;
  s.classList.remove("show"); sc.classList.remove("show");
  setTimeout(() => { if (!sheetOpen) { s.hidden = true; sc.hidden = true; } }, 380);
}
$("#scrim").onclick = closeSheet;
function toast(markup, ms = 2600) {
  const t = $("#toast");
  t.innerHTML = markup;
  t.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("show"), ms);
}

load();
</script>
</body>
